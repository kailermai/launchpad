appId: com.kailer.personallauncher
productName: PersonalLauncher
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  deleteAppDataOnUninstall: false
  shortcutName: Personal Launcher
portable:
  artifactName: PersonalLauncher-portable-${version}.exe
